# Zet de backend (map api/) automatisch live op Cloudflare bij elke push naar main
# die iets in api/ verandert. Nieuwe databasemigraties worden eerst uitgevoerd.
name: Backend live zetten

on:
  push:
    branches: [main]
    paths: ['api/**']
  workflow_dispatch:

concurrency: deploy-api

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Controleer of het Cloudflare-token is ingesteld
        run: test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::Secret CLOUDFLARE_API_TOKEN ontbreekt (zie README)"; exit 1; }
      - run: npm ci || npm install
      - name: Databasemigraties uitvoeren
        run: npx wrangler d1 migrations apply japansterdam --remote
      - name: Worker live zetten
        run: npx wrangler deploy

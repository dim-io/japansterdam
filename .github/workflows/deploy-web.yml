name: Website on Sam's Cloudflare account
on:
  push:
    branches: [main]
    paths: ['api/web/**', 'api/package.json', 'api/package-lock.json', 'scripts/prepare-images.py', 'js/**', 'css/**', 'admin/**', '*.html', 'assets/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency: deploy-web-preview
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.RADAR_CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: api
      - run: node --test api/web/*.test.mjs
      - run: python3 -m pip install Pillow==12.0.0
      - run: node api/web/build.mjs
      - run: npx wrangler deploy --config web/wrangler.toml
        working-directory: api

name: Backend naar Sams account verplaatsen
on:
  push:
    branches: [main]
    paths: ['tools/cloudflare-backend-transfer.mjs', '.github/workflows/backend-transfer.yml']
  workflow_dispatch:
    inputs:
      phase:
        description: Controle; kopieren wordt pas beschikbaar na geslaagde voorbereiding
        type: choice
        options: [plan]
        default: plan
permissions:
  contents: read
concurrency: backend-account-transfer
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Accountrechten en bestaande opslag controleren
        env:
          SOURCE_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TARGET_CLOUDFLARE_API_TOKEN: ${{ secrets.RADAR_CLOUDFLARE_API_TOKEN }}
          TRANSFER_PHASE: ${{ inputs.phase || 'plan' }}
        run: node tools/cloudflare-backend-transfer.mjs

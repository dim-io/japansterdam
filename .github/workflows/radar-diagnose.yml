name: Radarresultaten onderzoeken (alleen lezen)
on:
  push:
    branches: [main]
    paths: ['.github/scripts/radar-diagnose.mjs', '.github/workflows/radar-diagnose.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vergelijk bestaande resultaten zonder scans te starten
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node .github/scripts/radar-diagnose.mjs

name: Nieuwe radarbron analyseren (alleen lezen)
on:
  push:
    branches: [main]
    paths: ['.github/scripts/radar-monitor-audit.mjs', '.github/workflows/radar-monitor-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bestaande proefruns en nieuwe kandidaten uitlezen
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.RADAR_CLOUDFLARE_API_TOKEN }}
        run: node .github/scripts/radar-monitor-audit.mjs

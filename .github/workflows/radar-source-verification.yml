name: Radar gerichte bronproef
on:
  push:
    branches: [main]
    paths: ['api/radar/source-verification.mjs', '.github/workflows/radar-source-verification.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Drie bronproeven zonder meldingen (maximaal 9 dollarcent)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
          RADAR_PRIVATE_CONFIG: ${{ secrets.RADAR_PRIVATE_CONFIG }}
        run: node api/radar/source-verification.mjs

name: Radar broncontrole zonder scrape
on:
  push:
    branches: [main]
    paths: ['api/radar/source-audit.mjs', '.github/workflows/radar-source-audit.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bestaande bronopdrachten en plaatsingsdatums controleren
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node api/radar/source-audit.mjs

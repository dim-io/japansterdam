name: Vinted proefscan

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: japansterdam-vinted-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test één merk met maximaal drie advertenties
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: node tools/deal-radar/apify-probe.mjs

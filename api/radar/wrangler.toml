name = "japansterdam-radar"
account_id = "81a93f1ef55a892620ab77cf0f8163f6"
main = "worker.mjs"
compatibility_date = "2026-10-30"
workers_dev = true

[triggers]
# Wake frequently; the database reserves at most one actual scan per UTC hour.
# The fixed 24-hour trial gates every scan; wakeups outside it do nothing.
crons = ["*/5 * * * *"]

[vars]
SHOP_CATALOG_URL = "https://japansterdam-api.japansterdam-api.workers.dev/public/products"

[[d1_databases]]
binding = "RADAR_DB"
database_name = "japansterdam-radar"
database_id = "41d7b993-8791-4b19-b8fa-5a5db6eeda7e"

[ai]
binding = "AI"

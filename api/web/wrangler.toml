name = "japansterdam-web"
account_id = "81a93f1ef55a892620ab77cf0f8163f6"
main = "worker.mjs"
compatibility_date = "2026-10-30"
workers_dev = true
# Routes are managed in Cloudflare's zone dashboard:
# japansterdam.com/* and www.japansterdam.com/* -> japansterdam-web.
# Omit routes here so deployments preserve them without requiring zone-edit access.

[assets]
directory = "../../.site-dist"
binding = "ASSETS"
run_worker_first = true
not_found_handling = "404-page"

# Direct connection now that website and backend share Sams account.
[[services]]
binding = "API_BACKEND"
service = "japansterdam-api"

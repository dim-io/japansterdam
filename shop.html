<body>
<a class="skip" href="#main">Skip to content</a>
<header id="site-header"></header>
<main id="main">
<div class="wrap">
  <div class="shop-head"><h1 class="page-title" id="shop-title">Shop</h1><p class="count" id="shop-count" aria-live="polite"></p>
    <div class="density" id="density" role="group" aria-label="Grid density"><button type="button" data-d="large" aria-pressed="false"></button><button type="button" data-d="compact" aria-pressed="true"></button></div></div>
  <div class="filters" role="search" aria-label="Filter products">
    <div class="chips" id="f-chips" role="group" aria-label="Category"></div>
    <div class="selects">
      <div class="field-sel"><label for="f-brand">Brand</label><select class="sel" id="f-brand"></select></div>
      <div class="field-sel"><label for="f-size">Size</label><select class="sel" id="f-size"></select></div>
      <div class="field-sel"><label for="f-sort">Sort</label><select class="sel" id="f-sort"></select></div>
    </div>
  </div>
  <div class="grid" id="shop-grid"></div>
  <div class="promises" id="promises"></div>
</div>
<section class="closing">
  <div class="closing__img"><img src="assets/img/site/shop-atelier.jpg" alt="The workshop" width="2000" height="1333" loading="lazy" data-fade></div>
  <div class="closing__text"><blockquote id="closing-quote"></blockquote></div>
</section>
</main>
<footer id="site-footer"></footer>
